[project]
name = "openmedimgdataval-pipelines"
version = "0.1.0"
description = "Medical image data valuation pipelines"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Core ML
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",

    # Deep Learning (DenseNet121 classifier)
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # Optimal Transport
    "pot>=0.9.0",

    # Data download
    "kagglehub>=0.2.0",
    "synapseclient>=4.0.0",
    "python-dotenv>=1.0.0",

    # Data / Imaging
    "Pillow>=10.0.0",
    "nibabel>=5.0.0",

    # Visualization
    "matplotlib>=3.7.0",

    # Progress bars
    "tqdm>=4.65.0",
]
