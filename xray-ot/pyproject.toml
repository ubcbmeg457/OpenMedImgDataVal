[project]
name = "xray-ot"
version = "0.1.0"
description = "Standalone Python script for OT-based data valuation of chest X-ray classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",

    # Deep Learning (DenseNet121 classifier)
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # Optimal Transport
    "pot>=0.9.0",

    # Data
    "Pillow>=10.0.0",

    # Visualization
    "matplotlib>=3.7.0",
]
