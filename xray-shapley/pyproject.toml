[project]
name = "xray-shapley"
version = "0.1.0"
description = "SHAP-based data valuation for chest X-ray classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",

    # Deep Learning (feature extraction only)
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # Interpretable Models
    "xgboost>=2.0.0",

    # SHAP and Interpretability
    "shap>=0.48.0",

    # Data
    "kagglehub>=0.2.0",
    "Pillow>=10.0.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Notebook
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]
